# .github/workflows/build-ci.yml
# Nome del workflow volutamente invariato ("CI"): il badge del README punta a build-ci.yml
# e release.yml si aggancia al workflow chiamato "CI".
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1

jobs:
  # ------------------------------------------------------------------
  # Pint e PHPStan girano una sola volta (PHP 8.4, dipendenze più recenti ammesse da composer.json):
  # non ha senso ripeterli in ogni cella della matrice.
  # ------------------------------------------------------------------
  lint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mongodb, mbstring, curl, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  # ------------------------------------------------------------------
  # Test: matrice PHP x Laravel x MongoDB.
  # composer.lock viene ignorato di proposito (composer update): per una
  # libreria la matrice deve risolvere le dipendenze di ogni cella,
  # altrimenti le versioni di Laravel supportate non vengono testate davvero.
  # ------------------------------------------------------------------
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Mongo ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PHP 8.5 non blocca la pipeline finché la cella non è stabile:
    # togliere questa riga appena la matrice 8.5 è verde.
    continue-on-error: ${{ matrix.php == '8.5' }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        mongodb: ['7.0', '8.0']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Coverage calcolata su una sola cella (quella più recente)
          - php: '8.4'
            laravel: '13.*'
            mongodb: '8.0'
            coverage: true

    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, mbstring, curl, json
          coverage: ${{ matrix.coverage == true && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-progress --prefer-stable

      - name: Show resolved versions
        run: |
          php -v
          for p in laravel/framework mongodb/laravel-mongodb mongodb/mongodb orchestra/testbench pestphp/pest; do
            composer show "$p" | grep -E '^(name|versions)'
          done

      - name: Run tests
        env:
          MONGO_HOST: 127.0.0.1
          MONGO_PORT: 27017
          MONGO_DATABASE: unittest
        run: vendor/bin/pest ${{ matrix.coverage == true && '--coverage --coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.coverage == true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
