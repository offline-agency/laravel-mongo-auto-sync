services:
    tests:
        container_name: tests
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/code
        working_dir: /code
        environment:
            MONGO_HOST: mongodb
            MONGO_PORT: 27017
            MONGO_DATABASE: unittest
        depends_on:
            - mongodb
    mongodb:
        container_name: mongodb_
        image: mongo:8.0
        ports:
            - 27017:27017
        logging:
            driver: none
